name: Build Electron Release Artifacts

on:
  push:
    tags: ["electron-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Electron version to build, for example 1.2.0"
        required: true
        type: string
      draft:
        description: "Create a draft release instead of publishing it immediately"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Publish this version as a test build even without a semver prerelease suffix"
        required: true
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: electron release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "electron-v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("electron-v")) {
              Write-Error "Electron release tags must start with electron-v. got: $tag"
              exit 1
            }
            $version = $tag.Substring("electron-v".Length)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "Version must be semver without a leading v. got: $version"
            exit 1
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Sync Electron package version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content $pkgPath -Encoding UTF8
          npm install --package-lock-only --ignore-scripts

      # Hoist peer dependencies so Firebase Rules Unit Testing and test code
      # share the same Firestore SDK instance.
      - run: bun install --linker=hoisted

      - name: Verify release secrets
        shell: pwsh
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          $required = @(
            "YOUTUBE_OAUTH_CLIENT_ID",
            "YOUTUBE_OAUTH_CLIENT_SECRET"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            Write-Error "Required release secrets are missing: $($missing -join ', ')"
            exit 1
          }

      - name: Build Electron installer
        run: bun run electron:build
        env:
          LEAGUE_RECORD_CARGO_TOOLCHAIN: "+nightly"
          LEAGUE_RECORD_CARGO_BINDEPS: "1"
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}

      - name: Stage Electron artifacts
        shell: pwsh
        run: |
          $stageDir = ".artifacts/electron"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $version = "${{ steps.version.outputs.version }}"
          $setupName = "LeagueRecordElectron-Setup-$version.exe"
          $setupPath = Join-Path "release-electron" $setupName
          $blockmapPath = "$setupPath.blockmap"
          $updateMetadataPath = Join-Path "release-electron" "latest.yml"

          if (-not (Test-Path -LiteralPath $setupPath)) {
            Write-Error "Expected Electron installer was not found: $setupPath"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $blockmapPath)) {
            Write-Error "Electron updater blockmap was not found: $blockmapPath"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $updateMetadataPath)) {
            Write-Error "Electron updater metadata was not found: $updateMetadataPath"
            exit 1
          }

          $updateMetadata = Get-Content -LiteralPath $updateMetadataPath -Raw -Encoding UTF8
          $escapedVersion = [Regex]::Escape($version)
          if ($updateMetadata -notmatch "(?m)^version:\s*['`"]?$escapedVersion['`"]?\s*$") {
            Write-Error "latest.yml does not describe Electron version $version."
            exit 1
          }
          if (-not $updateMetadata.Contains($setupName)) {
            Write-Error "latest.yml does not reference the expected installer: $setupName"
            exit 1
          }

          Copy-Item -Force -LiteralPath $setupPath -Destination (Join-Path $stageDir $setupName)
          Copy-Item -Force -LiteralPath $blockmapPath -Destination (Join-Path $stageDir "$setupName.blockmap")
          Copy-Item -Force -LiteralPath $updateMetadataPath -Destination (Join-Path $stageDir "latest.yml")

      - name: Build Electron release body
        id: release_body
        shell: pwsh
        run: |
          $body = "Windows x64 Electron installer.`nVersion: ${{ steps.version.outputs.version }}"
          if (Test-Path "release_notes.json") {
            try {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                if ($rn.notes -is [System.Array]) {
                  $joined = ($rn.notes -join "`n")
                  if (-not [string]::IsNullOrWhiteSpace($joined)) { $body = $joined }
                } else {
                  $notesText = [string]$rn.notes
                  if (-not [string]::IsNullOrWhiteSpace($notesText)) { $body = $notesText }
                }
              }
            } catch {
              Write-Warning "release_notes.json parse failed. Fallback to default body."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: LeagueRecord Electron v${{ steps.version.outputs.version }}
          artifacts: "./.artifacts/electron/*"
          allowUpdates: true
          replacesArtifacts: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
          makeLatest: ${{ (contains(steps.version.outputs.version, '-') || (github.event_name == 'workflow_dispatch' && inputs.prerelease)) && 'false' || 'true' }}
          body: ${{ steps.release_body.outputs.body }}

      - name: Verify published Electron release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $isPrerelease = "${{ contains(steps.version.outputs.version, '-') || (github.event_name == 'workflow_dispatch' && inputs.prerelease) }}" -eq "true"
          $isDraft = "${{ github.event_name == 'workflow_dispatch' && inputs.draft }}" -eq "true"
          $expectedAssets = @(
            "LeagueRecordElectron-Setup-$version.exe",
            "LeagueRecordElectron-Setup-$version.exe.blockmap",
            "latest.yml"
          )

          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $missing = @($expectedAssets | Where-Object { $_ -notin $assetNames })
          if ($missing.Count -gt 0) {
            Write-Error "Published Electron release is missing updater assets: $($missing -join ', ')"
            exit 1
          }
          if ([bool]$release.prerelease -ne $isPrerelease) {
            Write-Error "Release prerelease state does not match version $version."
            exit 1
          }

          if (-not $isDraft -and -not $isPrerelease) {
            $latest = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            if ($latest.tag_name -ne $tag) {
              Write-Error "GitHub latest release is $($latest.tag_name), expected $tag."
              exit 1
            }
          }
