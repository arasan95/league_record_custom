name: Build Electron Release Artifacts

on:
  push:
    tags: ["electron-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Electron version to build, for example 1.2.0"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: electron release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "electron-v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("electron-v")) {
              Write-Error "Electron release tags must start with electron-v. got: $tag"
              exit 1
            }
            $version = $tag.Substring("electron-v".Length)
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "Version must be semver without a leading v. got: $version"
            exit 1
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Sync Electron package version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content $pkgPath -Encoding UTF8
          npm install --package-lock-only --ignore-scripts

      - run: bun install --linker=isolated

      - name: Verify release secrets
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          $required = @(
            "WINDOWS_CERTIFICATE_BASE64",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "YOUTUBE_OAUTH_CLIENT_ID",
            "YOUTUBE_OAUTH_CLIENT_SECRET"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            Write-Error "Required release secrets are missing: $($missing -join ', ')"
            exit 1
          }

      - name: Build Electron installer
        run: bun run electron:build
        env:
          LEAGUE_RECORD_CARGO_TOOLCHAIN: "+nightly"
          LEAGUE_RECORD_CARGO_BINDEPS: "1"
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release-electron" -Filter "*.exe" -File -Recurse
          if ($files.Count -eq 0) {
            Write-Error "No signed Windows executables were produced."
            exit 1
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              Write-Error "Invalid Authenticode signature: $($file.Name) ($($signature.Status))"
              exit 1
            }
          }

      - name: Stage Electron artifacts
        shell: pwsh
        run: |
          $stageDir = ".artifacts/electron"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $setup = Get-ChildItem -Path "release-electron" -Filter "LeagueRecordElectron-Setup-*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $setup) {
            Write-Error "Electron installer was not found in release-electron."
            exit 1
          }

          Copy-Item -Force -LiteralPath $setup.FullName -Destination (Join-Path $stageDir $setup.Name)

          $blockmapPath = "$($setup.FullName).blockmap"
          if (Test-Path -LiteralPath $blockmapPath) {
            Copy-Item -Force -LiteralPath $blockmapPath -Destination (Join-Path $stageDir "$($setup.Name).blockmap")
          } else {
            Write-Warning "Blockmap was not found: $blockmapPath"
          }

      - name: Build Electron release body
        id: release_body
        shell: pwsh
        run: |
          $body = "Windows x64 Electron installer.`nVersion: ${{ steps.version.outputs.version }}"
          if (Test-Path "release_notes.json") {
            try {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                if ($rn.notes -is [System.Array]) {
                  $joined = ($rn.notes -join "`n")
                  if (-not [string]::IsNullOrWhiteSpace($joined)) { $body = $joined }
                } else {
                  $notesText = [string]$rn.notes
                  if (-not [string]::IsNullOrWhiteSpace($notesText)) { $body = $notesText }
                }
              }
            } catch {
              Write-Warning "release_notes.json parse failed. Fallback to default body."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: LeagueRecord Electron v${{ steps.version.outputs.version }}
          artifacts: "./.artifacts/electron/*"
          allowUpdates: true
          replacesArtifacts: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: true
          body: ${{ steps.release_body.outputs.body }}
