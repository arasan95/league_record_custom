name: Prune Firestore Retention

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without changing Firestore"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firestore-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --linker=hoisted
      - name: Verify Admin SDK credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_JSON is required."
            exit 1
          fi
      - name: Remove data beyond retention limits
        env:
          FIREBASE_PROJECT_ID: leaguerecord
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        # --quiet prevents replay IDs, comment paths, counts, and storage
        # information from appearing in logs of a public repository.
        run: bun run db:prune --quiet ${{ inputs.dry_run == true && '--dry-run' || '' }}
