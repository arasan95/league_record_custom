name: Build Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: cargo release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      # Update version based on tag
      - name: Update Version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $version = $tag.Substring(1) } else { $version = $tag }
          Write-Host "Syncing version to $version"
          $path = "src-tauri/Cargo.toml"
          (Get-Content $path) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $path

          # Update README version links
          (Get-Content readme.md -Encoding utf8) -replace 'LeagueRecord_.*_x64-setup\.exe', "LeagueRecord_${version}_x64-setup.exe" | Set-Content readme.md -Encoding utf8
          (Get-Content README_ja.md -Encoding utf8) -replace 'LeagueRecord_.*_x64-setup\.exe', "LeagueRecord_${version}_x64-setup.exe" | Set-Content README_ja.md -Encoding utf8

      - name: Commit and Push README changes
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readme.md README_ja.md
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: update version in READMEs to ${{ github.ref_name }}"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:main
          else
            echo "No changes in READMEs."
          fi

      - run: bun install --linker=isolated && bun run --bun tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: 7z a -tzip LeagueRecord_${{ github.ref_name }}_x64_en-US.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - run: 7z a -tzip LeagueRecord_x64.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }

          $sigPaths = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/" -Filter "*.exe.sig")
          if ($sigPaths.Count -eq 0) {
              Write-Error "Failed to find .exe.sig file for auto updater"
              exit 1
          }
          $sigPath = $sigPaths[0].FullName
          $sig = Get-Content $sigPath -Raw
          $zipName = $sigPaths[0].Name -replace "\.sig$", ""

          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$zipName"

          $notes = "Update v$version"
          if (Test-Path "release_notes.json") {
              $rn = Get-Content "release_notes.json" -Raw | ConvertFrom-Json
              if ($null -ne $rn.notes) { $notes = $rn.notes }
          }

          $json = @{
            version = "v$version"
            notes = $notes
            pub_date = $date
            platforms = @{
                "windows-x86_64" = @{
                    signature = $sig
                    url = $url
                }
            }
          }
          $json | ConvertTo-Json -Depth 10 | Out-File latest.json -Encoding utf8

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "./src-tauri/target/release/*.zip, ./src-tauri/target/release/bundle/nsis/*, latest.json"
          prerelease: false
          body: |
            Windows-x64 installer and portable version.
            Version: ${{ github.ref_name }}
