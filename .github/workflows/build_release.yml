name: Build Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: cargo release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Remove non-release helper bins
        shell: pwsh
        run: |
          $helperBins = @(
            "src-tauri/src/bin/extract_rcp_asset.rs",
            "src-tauri/src/bin/find_wad_object.rs",
            "src-tauri/src/bin/rebuild_tooltip_cache.rs",
            "src-tauri/src/bin/dump_aphelios_wad_tooltips.rs"
          )
          foreach ($bin in $helperBins) {
            if (Test-Path $bin) {
              Remove-Item -LiteralPath $bin -Force
              Write-Host "Removed helper bin: $bin"
            }
          }
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      # Update version based on tag
      - name: Update Version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $version = $tag.Substring(1) } else { $version = $tag }
          Write-Host "Syncing version to $version"
          $path = "src-tauri/Cargo.toml"
          (Get-Content $path) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $path

      - name: Bundle FFmpeg for build
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ff = (Get-Command ffmpeg -ErrorAction Stop).Source
          if (-not (Test-Path $ff)) {
            Write-Error "ffmpeg.exe not found"
            exit 1
          }
          $versionLine = (& $ff -version | Select-Object -First 1)
          $version = "unknown"
          if ($versionLine -match '^ffmpeg version\s+([^\s]+)') {
            $version = $Matches[1]
          }
          ./src-tauri/resources/tools/ffmpeg/update_ffmpeg_bundle.ps1 `
            -FfmpegExePath $ff `
            -Version $version `
            -SourceName "Chocolatey ffmpeg package" `
            -SourceUrl "https://community.chocolatey.org/packages/ffmpeg"

      - run: bun install --linker=isolated && bun run --bun tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: 7z a -tzip LeagueRecord_${{ github.ref_name }}_x64_en-US.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - run: 7z a -tzip LeagueRecord_x64.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - name: Create stable installer filename for latest link
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            Write-Error "Could not find setup exe in $nsisDir"
            exit 1
          }
          Copy-Item -Force $setup.FullName (Join-Path $nsisDir "LeagueRecord_x64-setup.exe")

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }

          $sigPaths = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/" -Filter "*.exe.sig")
          if ($sigPaths.Count -eq 0) {
              Write-Error "Failed to find .exe.sig file for auto updater"
              exit 1
          }
          $sigPath = $sigPaths[0].FullName
          $sig = Get-Content $sigPath -Raw
          $zipName = $sigPaths[0].Name -replace "\.sig$", ""

          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$zipName"

          $notes = "Update v$version"
          if (Test-Path "release_notes.json") {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                  if ($rn.notes -is [System.Array]) {
                      $notes = ($rn.notes -join "`n")
                  } else {
                      $notes = [string]$rn.notes
                  }
              }
          }

          $json = @{
            # Tauri updater expects a semver string (e.g. "1.1.15"), not "v1.1.15".
            version = "$version"
            notes = $notes
            pub_date = $date
            platforms = @{
                "windows-x86_64" = @{
                    signature = $sig
                    url = $url
                }
            }
          }
          $jsonText = $json | ConvertTo-Json -Depth 10
          Set-Content -Path latest.json -Value $jsonText -Encoding utf8NoBOM

      - name: Validate latest.json
        shell: pwsh
        run: |
          if (-not (Test-Path "latest.json")) {
            Write-Error "latest.json not found"
            exit 1
          }

          $latest = Get-Content "latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($latest.version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "latest.json version must be semver without a leading 'v'. got: $($latest.version)"
            exit 1
          }

          if ($latest.notes.Contains([char]0xFFFD)) {
            Write-Error "latest.json notes appear to contain mojibake/replacement characters."
            exit 1
          }

      - name: Build release body from release_notes.json
        id: release_body
        shell: pwsh
        run: |
          $body = "Windows-x64 installer and portable version.`nVersion: ${{ github.ref_name }}"
          if (Test-Path "release_notes.json") {
            try {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                if ($rn.notes -is [System.Array]) {
                  $joined = ($rn.notes -join "`n")
                  if ([string]::IsNullOrWhiteSpace($joined) -eq $false) {
                    $body = $joined
                  }
                } else {
                  $notesText = [string]$rn.notes
                  if ([string]::IsNullOrWhiteSpace($notesText) -eq $false) {
                    $body = $notesText
                  }
                }
              }
            } catch {
              Write-Warning "release_notes.json parse failed. Fallback to default body."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "./src-tauri/target/release/*.zip, ./src-tauri/target/release/bundle/nsis/*, latest.json"
          prerelease: true
          body: ${{ steps.release_body.outputs.body }}
