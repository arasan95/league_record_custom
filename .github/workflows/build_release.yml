name: Build Release Artifacts

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: cargo release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      # Update version based on tag
      - name: Update Version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.StartsWith("v")) { $version = $tag.Substring(1) } else { $version = $tag }
          Write-Host "Syncing version to $version"
          $path = "src-tauri/Cargo.toml"
          (Get-Content $path) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $path

      - run: bun install --linker=isolated

      - name: Prepare updater-only Tauri config (without bundled FFmpeg runtime)
        shell: pwsh
        run: |
          $sourcePath = "src-tauri/tauri.conf.json"
          $targetPath = "src-tauri/tauri.updater.conf.json"
          $cfg = Get-Content $sourcePath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($null -eq $cfg.bundle -or $null -eq $cfg.bundle.resources) {
            Write-Error "bundle.resources not found in $sourcePath"
            exit 1
          }
          $cfg.bundle.createUpdaterArtifacts = $true
          if ($cfg.bundle.resources.PSObject.Properties.Name -contains "resources/tools/ffmpeg/*") {
            $cfg.bundle.resources.PSObject.Properties.Remove("resources/tools/ffmpeg/*")
            Write-Host "Removed FFmpeg runtime resource entry for updater build."
          } else {
            Write-Host "FFmpeg runtime resource entry not found; updater build already excludes it."
          }
          $cfg | ConvertTo-Json -Depth 100 | Set-Content $targetPath -Encoding UTF8

      - name: Build updater package (no bundled FFmpeg)
        run: bun run --bun tauri build --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage updater artifacts for release and latest.json
        id: updater_stage
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stageDir = ".artifacts/updater"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $setup = Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            Write-Error "Could not find updater setup exe in $nsisDir"
            exit 1
          }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            Write-Error "Could not find updater signature: $sigPath"
            exit 1
          }

          $updaterExeName = "LeagueRecord_${tag}_x64-updater.exe"
          $updaterSigName = "${updaterExeName}.sig"
          Copy-Item -Force $setup.FullName (Join-Path $stageDir $updaterExeName)
          Copy-Item -Force $sigPath (Join-Path $stageDir $updaterSigName)

          Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_exe_name=$updaterExeName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_sig_path=$(Join-Path $stageDir $updaterSigName)"

      - name: Bundle FFmpeg for installer build
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ff = (Get-Command ffmpeg -ErrorAction Stop).Source
          if ($ff -match '\\chocolatey\\bin\\ffmpeg\.exe$') {
            $resolved = Get-ChildItem -Path "$env:ChocolateyInstall\lib\ffmpeg*\tools\ffmpeg\bin\ffmpeg.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($null -ne $resolved) {
              $ff = $resolved.FullName
            }
          }
          if (-not (Test-Path $ff)) {
            Write-Error "ffmpeg.exe not found"
            exit 1
          }
          Write-Host "Using ffmpeg binary: $ff"
          $versionLine = (& $ff -version | Select-Object -First 1)
          $version = "unknown"
          if ($versionLine -match '^ffmpeg version\s+([^\s]+)') {
            $version = $Matches[1]
          }
          ./src-tauri/resources/tools/ffmpeg/update_ffmpeg_bundle.ps1 `
            -FfmpegExePath $ff `
            -Version $version `
            -SourceName "Chocolatey ffmpeg package" `
            -SourceUrl "https://community.chocolatey.org/packages/ffmpeg"
      - name: Verify FFmpeg provenance
        shell: pwsh
        run: |
          $provenancePath = "src-tauri/resources/tools/ffmpeg/ffmpeg-provenance.json"
          $exePath = "src-tauri/resources/tools/ffmpeg/ffmpeg.exe"
          if (-not (Test-Path $provenancePath)) { Write-Error "provenance not found"; exit 1 }
          if (-not (Test-Path $exePath)) { Write-Error "ffmpeg.exe not found"; exit 1 }
          $provenance = Get-Content $provenancePath -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $provenance.sha256.ToLowerInvariant()) { Write-Error "FFmpeg SHA256 mismatch: expected $($provenance.sha256) got $actual"; exit 1 }
          Write-Host "FFmpeg provenance verified: $actual (version $($provenance.version))"

      - name: Build installer package (with bundled FFmpeg)
        run: bun run --bun tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - run: 7z a -tzip LeagueRecord_${{ github.ref_name }}_x64_en-US.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - run: 7z a -tzip LeagueRecord_x64.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        working-directory: ./src-tauri/target/release/

      - name: Create stable installer filename for latest link
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            Write-Error "Could not find setup exe in $nsisDir"
            exit 1
          }
          Copy-Item -Force $setup.FullName (Join-Path $nsisDir "LeagueRecord_x64-setup.exe")

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }

          $updaterSigPath = "${{ steps.updater_stage.outputs.updater_sig_path }}"
          if (-not (Test-Path $updaterSigPath)) {
              Write-Error "Failed to find updater .sig file for auto updater: $updaterSigPath"
              exit 1
          }
          $sig = Get-Content $updaterSigPath -Raw
          $updaterExeName = "${{ steps.updater_stage.outputs.updater_exe_name }}"
          if ([string]::IsNullOrWhiteSpace($updaterExeName)) {
            Write-Error "updater_exe_name output is empty"
            exit 1
          }

          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$updaterExeName"

          $notes = "Update v$version"
          if (Test-Path "release_notes.json") {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                  if ($rn.notes -is [System.Array]) {
                      $notes = ($rn.notes -join "`n")
                  } else {
                      $notes = [string]$rn.notes
                  }
              }
          }

          $json = @{
            # Tauri updater expects a semver string (e.g. "1.1.15"), not "v1.1.15".
            version = "$version"
            notes = $notes
            pub_date = $date
            platforms = @{
                "windows-x86_64" = @{
                    signature = $sig
                    url = $url
                }
            }
          }
          $jsonText = $json | ConvertTo-Json -Depth 10
          Set-Content -Path latest.json -Value $jsonText -Encoding utf8NoBOM

      - name: Validate latest.json
        shell: pwsh
        run: |
          if (-not (Test-Path "latest.json")) {
            Write-Error "latest.json not found"
            exit 1
          }

          $latest = Get-Content "latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($latest.version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "latest.json version must be semver without a leading 'v'. got: $($latest.version)"
            exit 1
          }

          if ($latest.notes.Contains([char]0xFFFD)) {
            Write-Error "latest.json notes appear to contain mojibake/replacement characters."
            exit 1
          }

      - name: Build release body from release_notes.json
        id: release_body
        shell: pwsh
        run: |
          $body = "Windows-x64 installer and portable version.`nVersion: ${{ github.ref_name }}"
          if (Test-Path "release_notes.json") {
            try {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                if ($rn.notes -is [System.Array]) {
                  $joined = ($rn.notes -join "`n")
                  if ([string]::IsNullOrWhiteSpace($joined) -eq $false) {
                    $body = $joined
                  }
                } else {
                  $notesText = [string]$rn.notes
                  if ([string]::IsNullOrWhiteSpace($notesText) -eq $false) {
                    $body = $notesText
                  }
                }
              }
            } catch {
              Write-Warning "release_notes.json parse failed. Fallback to default body."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "./src-tauri/target/release/*.zip, ./src-tauri/target/release/bundle/nsis/*, ./.artifacts/updater/*, latest.json"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: true
          body: ${{ steps.release_body.outputs.body }}
