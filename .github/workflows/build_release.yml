name: Build Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag for the draft (for example, v1.3.0-rc.1)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: cargo release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Validate release version
        id: release_version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-rc\.[1-9]\d*)?$') {
            throw 'Use a Tauri release tag in the form vX.Y.Z or vX.Y.Z-rc.N.'
          }
          $version = $Matches['version']
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installer_name=LeagueRecord_${version}_x64-setup.exe"
          $manifest = Get-Content 'src-tauri/Cargo.toml' -Raw
          $appVersion = [regex]::Match($manifest, '(?m)^version = "([^"]+)"\r?$').Groups[1].Value
          if ($appVersion -cne $version) { throw "Release tag $tag does not match Cargo.toml version $appVersion." }

      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun audit
      - uses: ./.github/actions/verify

      - name: Prepare updater-only Tauri config (without bundled FFmpeg runtime)
        shell: pwsh
        run: |
          $sourcePath = "src-tauri/tauri.conf.json"
          $targetPath = "src-tauri/tauri.updater.conf.json"
          $cfg = Get-Content $sourcePath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($null -eq $cfg.bundle -or $null -eq $cfg.bundle.resources) {
            Write-Error "bundle.resources not found in $sourcePath"
            exit 1
          }
          $cfg.bundle.createUpdaterArtifacts = $true
          if ($cfg.bundle.resources.PSObject.Properties.Name -contains "resources/tools/ffmpeg/*") {
            $cfg.bundle.resources.'resources/tools/ffmpeg/*' = $null
            Write-Host "Removed FFmpeg runtime resource entry for updater build."
          } else {
            Write-Host "FFmpeg runtime resource entry not found; updater build already excludes it."
          }
          $cfg | ConvertTo-Json -Depth 100 | Set-Content $targetPath -Encoding UTF8

      - name: Build updater package (no bundled FFmpeg)
        run: bunx tauri build --config src-tauri/tauri.updater.conf.json -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage updater artifacts for release and latest.json
        id: updater_stage
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $stageDir = ".artifacts/updater"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null

          $setup = Get-Item -LiteralPath (Join-Path $nsisDir '${{ steps.release_version.outputs.installer_name }}') -ErrorAction Stop
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            Write-Error "Could not find updater signature: $sigPath"
            exit 1
          }

          $updaterExeName = "LeagueRecord_${tag}_x64-updater.exe"
          $updaterSigName = "${updaterExeName}.sig"
          Move-Item -Force -LiteralPath $setup.FullName -Destination (Join-Path $stageDir $updaterExeName)
          Move-Item -Force -LiteralPath $sigPath -Destination (Join-Path $stageDir $updaterSigName)

          Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_exe_name=$updaterExeName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_sig_path=$(Join-Path $stageDir $updaterSigName)"

      - name: Bundle FFmpeg for installer build
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ff = (Get-Command ffmpeg -ErrorAction Stop).Source
          if ($ff -match '\\chocolatey\\bin\\ffmpeg\.exe$') {
            $resolved = Get-ChildItem -Path "$env:ChocolateyInstall\lib\ffmpeg*\tools\ffmpeg\bin\ffmpeg.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($null -ne $resolved) {
              $ff = $resolved.FullName
            }
          }
          if (-not (Test-Path $ff)) {
            Write-Error "ffmpeg.exe not found"
            exit 1
          }
          Write-Host "Using ffmpeg binary: $ff"
          $versionLine = (& $ff -version | Select-Object -First 1)
          $version = "unknown"
          if ($versionLine -match '^ffmpeg version\s+([^\s]+)') {
            $version = $Matches[1]
          }
          ./src-tauri/resources/tools/ffmpeg/update_ffmpeg_bundle.ps1 `
            -FfmpegExePath $ff `
            -Version $version `
            -SourceName "Chocolatey ffmpeg package" `
            -SourceUrl "https://community.chocolatey.org/packages/ffmpeg"

      - name: Build installer package (with bundled FFmpeg)
        run: bunx tauri build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)

          $updaterSigPath = "${{ steps.updater_stage.outputs.updater_sig_path }}"
          if (-not (Test-Path $updaterSigPath)) {
              Write-Error "Failed to find updater .sig file for auto updater: $updaterSigPath"
              exit 1
          }
          $sig = Get-Content $updaterSigPath -Raw
          $updaterExeName = "${{ steps.updater_stage.outputs.updater_exe_name }}"
          if ([string]::IsNullOrWhiteSpace($updaterExeName)) {
            Write-Error "updater_exe_name output is empty"
            exit 1
          }

          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$updaterExeName"

          $notes = "Update v$version"
          if (Test-Path "release_notes.json") {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                  if ($rn.notes -is [System.Array]) {
                      $notes = ($rn.notes -join "`n")
                  } else {
                      $notes = [string]$rn.notes
                  }
              }
          }

          $json = @{
            # Tauri updater expects a semver string (e.g. "1.1.15"), not "v1.1.15".
            version = "$version"
            notes = $notes
            pub_date = $date
            platforms = @{
                "windows-x86_64" = @{
                    signature = $sig
                    url = $url
                }
            }
          }
          $jsonText = $json | ConvertTo-Json -Depth 10
          Set-Content -Path latest.json -Value $jsonText -Encoding utf8NoBOM

      - name: Validate release assets and updater manifest
        shell: pwsh
        run: |
          if (-not (Test-Path "latest.json")) {
            Write-Error "latest.json not found"
            exit 1
          }

          $latest = Get-Content "latest.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $installerPath = 'src-tauri/target/release/bundle/nsis/${{ steps.release_version.outputs.installer_name }}'
          $updaterName = '${{ steps.updater_stage.outputs.updater_exe_name }}'
          $updaterPath = Join-Path '.artifacts/updater' $updaterName
          foreach ($path in @($installerPath, $updaterPath)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset: $path" }
          }
          $windows = $latest.platforms.'windows-x86_64'
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$updaterName"
          $signature = Get-Content -LiteralPath '${{ steps.updater_stage.outputs.updater_sig_path }}' -Raw
          if ($windows.url -cne $expectedUrl -or !$signature.Trim() -or $windows.signature -cne $signature) {
            throw 'latest.json does not reference the staged Windows updater and its signature.'
          }
          if ($latest.version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "latest.json version must be semver without a leading 'v'. got: $($latest.version)"
            exit 1
          }

          if ($latest.notes.Contains([char]0xFFFD)) {
            Write-Error "latest.json notes appear to contain mojibake/replacement characters."
            exit 1
          }

      - name: Build release body from release_notes.json
        id: release_body
        shell: pwsh
        run: |
          $body = "Windows x64 installer.`nVersion: $env:RELEASE_TAG"
          if (Test-Path "release_notes.json") {
            try {
              $rn = Get-Content "release_notes.json" -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($null -ne $rn.notes) {
                if ($rn.notes -is [System.Array]) {
                  $joined = ($rn.notes -join "`n")
                  if ([string]::IsNullOrWhiteSpace($joined) -eq $false) {
                    $body = $joined
                  }
                } else {
                  $notesText = [string]$rn.notes
                  if ([string]::IsNullOrWhiteSpace($notesText) -eq $false) {
                    $body = $notesText
                  }
                }
              }
            } catch {
              Write-Warning "release_notes.json parse failed. Fallback to default body."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          artifacts: "./src-tauri/target/release/bundle/nsis/${{ steps.release_version.outputs.installer_name }}, ./.artifacts/updater/${{ steps.updater_stage.outputs.updater_exe_name }}, latest.json"
          artifactErrorsFailBuild: true
          draft: true
          prerelease: true
          body: ${{ steps.release_body.outputs.body }}


      - name: List Windows release acceptance checks
        shell: pwsh
        run: |
          @'
          ### Before publishing this draft
          - On a clean Windows installation without FFmpeg, install the signed package and create a clip.
          - Upgrade from the previous release through the signed updater and create a clip again.
          - Check recording start and stop, playback seeking, and hiding and reopening the window from the tray.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
