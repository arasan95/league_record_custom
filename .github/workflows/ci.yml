name: CI

on:
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@nightly
      - run: bun install --frozen-lockfile --linker=isolated
      - run: bun audit
      - uses: ./.github/actions/verify
      - uses: ./.github/actions/build-clip-ffmpeg
      - run: bunx tauri build --config src-tauri/target/clip-ffmpeg/installer.conf.json -- --locked
      - name: Verify installer contents and size
        shell: pwsh
        run: |
          $Installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File
          if (@($Installer).Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          ./src-tauri/resources/tools/ffmpeg/test-package.ps1 -Installer $Installer.FullName
