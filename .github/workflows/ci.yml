name: CI

on:
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"
      - name: Bundle FFmpeg for build
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ff = (Get-Command ffmpeg -ErrorAction Stop).Source
          if ($ff -match '\\chocolatey\\bin\\ffmpeg\.exe$') {
            $resolved = Get-ChildItem -Path "$env:ChocolateyInstall\lib\ffmpeg*\tools\ffmpeg\bin\ffmpeg.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($null -ne $resolved) {
              $ff = $resolved.FullName
            }
          }
          if (-not (Test-Path $ff)) {
            Write-Error "ffmpeg.exe not found"
            exit 1
          }
          Write-Host "Using ffmpeg binary: $ff"
          $versionLine = (& $ff -version | Select-Object -First 1)
          $version = "unknown"
          if ($versionLine -match '^ffmpeg version\s+([^\s]+)') {
            $version = $Matches[1]
          }
          ./src-tauri/resources/tools/ffmpeg/update_ffmpeg_bundle.ps1 `
            -FfmpegExePath $ff `
            -Version $version `
            -SourceName "Chocolatey ffmpeg package" `
            -SourceUrl "https://community.chocolatey.org/packages/ffmpeg"
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Responsibility Coverage Check
        run: bun run check:responsibility
      - run: bun run --bun tauri build
