[package]
name = "league_record_devtools"
version = "1.1.33"
edition = "2021"

[workspace]

[[bin]]
name = "rebuild_tooltip_cache"
path = "bin/rebuild_tooltip_cache.rs"

[[bin]]
name = "hotkey_listener"
path = "bin/hotkey_listener.rs"

[dependencies]
anyhow = "1.0.98"
byteorder = "1.5.0"
hex = "0.4.3"
log = "0.4.27"
rayon = "1.11.0"
regex = "1.12.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
zstd = "0.13.3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
