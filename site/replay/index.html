<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>LeagueRecord 共有リプレイ</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #171717; color: #e8e8e8; }
    main { width: min(100%, 520px); padding: 30px; border: 1px solid #454545; border-radius: 12px; background: #232323; box-shadow: 0 20px 60px #0008; }
    h1 { margin: 0 0 12px; font-size: 23px; }
    p { margin: 8px 0; color: #bdbdbd; line-height: 1.65; }
    button { width: 100%; margin-top: 18px; padding: 12px 18px; border: 1px solid #666; border-radius: 7px; background: #3a3a3a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4a4a4a; }
    #status { min-height: 1.6em; margin-top: 15px; color: #a9a9a9; font-size: 14px; }
    .error { color: #ffaaaa !important; }
    small { display: block; margin-top: 18px; color: #888; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <h1>LeagueRecord 共有リプレイ</h1>
    <p>LeagueRecordを起動して、招待を適用した状態で共有リプレイを開きます。</p>
    <p lang="en">Open the shared replay in LeagueRecord and apply its invitation.</p>
    <button id="open-app" type="button">LeagueRecordで開く / Open LeagueRecord</button>
    <div id="status" role="status" aria-live="polite">アプリを起動しています…</div>
    <small>アプリがインストールされていない場合は起動できません。招待リンクは転送せず、受け取った本人だけが使用してください。</small>
  </main>
  <script>
    (() => {
      const status = document.querySelector("#status");
      const button = document.querySelector("#open-app");
      const params = new URLSearchParams(location.search);
      const keys = [...params.keys()];
      const videoId = params.get("v") || "";
      const invite = (params.get("invite") || "").toLowerCase();
      const valid = keys.length === 2 && keys.includes("v") && keys.includes("invite")
        && /^[A-Za-z0-9_-]{11}$/.test(videoId) && /^[0-9a-f]{48}$/.test(invite);
      if (!valid) {
        status.textContent = "共有リンクが不正です。 / Invalid replay link.";
        status.classList.add("error");
        button.disabled = true;
        return;
      }
      const appUrl = new URL("leaguerecord://replay");
      appUrl.searchParams.set("v", videoId);
      appUrl.searchParams.set("invite", invite);
      const openApp = () => {
        status.textContent = "LeagueRecordを起動しています… / Opening LeagueRecord…";
        location.href = appUrl.toString();
        setTimeout(() => {
          status.textContent = "起動しない場合は、上のボタンをもう一度押してください。 / If it did not open, press the button again.";
        }, 1600);
      };
      button.addEventListener("click", openApp);
      setTimeout(openApp, 250);
    })();
  </script>
</body>
</html>
